[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr-runner"
version = "0.1.0"
description = "Chaos-Driven Refactoring runner: inject chaos, classify failures, generate and verify refactor patches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cdr = "cdr.cli:main"

[tool.setuptools.packages.find]
include = ["cdr*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
